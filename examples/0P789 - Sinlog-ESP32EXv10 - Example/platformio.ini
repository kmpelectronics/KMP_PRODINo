; PlatformIO Project Configuration File
;
; Sinlog-ESP32EXv10 example.
; Uses the pioarduino ESP32 platform (Arduino core 3.x / IDF 5.x) so the W5500
; Ethernet runs on the native lwIP stack (ETH.begin(ETH_PHY_W5500, ...)) alongside
; WiFi - a single web server then serves on both interfaces.

[env:esp32dev]
; pioarduino builder for IDF 5.1 / Arduino core 3.0.x (W5500 lwIP support).
; 51.03.x (IDF 5.1) keeps the flat libs layout - it avoids the deep Matter header
; paths in 54.x (IDF 5.4) that trip the Windows 260-char path limit on unpack.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
upload_speed = 921600
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=1
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.13
	adafruit/Adafruit GFX Library@^1.11.11
	makuna/NeoPixelBus@^2.8.0
	bblanchon/ArduinoJson@^7.2.0
