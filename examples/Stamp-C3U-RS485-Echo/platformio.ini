; Stamp-C3U-RS485-Echo
; M5Stamp C3U (ESP32-C3, native USB) + Stamp PWR485 RS485 module.
; RS485 echo tester: "ping" -> "pong", anything else -> reversed.

[env:esp32-c3-devkitm-1]
; Pin to the installed core-2.x platform (ESP32-C3 needs no core 3.x here);
; an unpinned 'espressif32' resolves to a core-3.x release whose Matter libs
; trip the Windows 260-char path limit on unpack.
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	makuna/NeoPixelBus@^2.8.0
